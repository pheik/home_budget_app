name: home_budget_app
description: "A simple application for monthly budgeting."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
      sdk: flutter
  intl: any
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  date_field: ^6.0.0
